th="200"><tspan x="810" dy="0">push</tspan></text><polyline points="923,545 699,545" fill="none" stroke="#172C36" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="713.0413209902459,537.3291913823327 699,545 713.0413209902459,552.6708086176673" fill="none" stroke="#172C36" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="810" y="602.08" font-family="Courier New, monospace" font-size="28" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="200"><tspan x="810" dy="0">fetch</tspan></text><rect x="72" y="746" width="1456" height="62" rx="14" fill="#E4E8E2" stroke="none" stroke-width="2"/><text x="99" y="784.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#172C36" text-anchor="start" data-max-width="1385"><tspan x="99" dy="0">Commit ≠ Push. Ein PR ist der gemeinsame Raum für Prüfung und Integration.</tspan></text></svg></section><section class="slide" id="slide-4" data-document-role="page" data-label="Ändern. Auswählen. Festhalten." data-speaker-notes="Working Tree: Dateien bearbeiten. Staging Area oder Index: den nächsten Commit bewusst vorbereiten. Repository: Commit dauerhaft in der lokalen History halten. Die Farben sind nur Lernhilfen, die Beschriftungen tragen die Bedeutung. Mit git diff die ungestagten, mit git diff --staged die gestagten Änderungen prüfen. Neu bearbeitete Inhalte müssen nach dem Staging erneut gestagt werden."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ändern. Auswählen. Festhalten."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F3EA" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" fon vetica, sans-serif" font-size="27" font-weight="400" fill="#F5F3EA" text-anchor="start" data-max-width="1385"><tspan x="99" dy="0">Nochmals git add ausführen, wenn Version 2 ebenfalls in den Commit soll.</tspan></text></svg></section><section class="slide" id="slide-6" data-document-role="page" data-label="Ein Commit hält einen Stand fest." data-speaker-notes="Ein Commit verweist auf den kompletten versionierten Projektstand, nicht nur auf den angezeigten Diff. Git speichert identische Objekte effizient, das Bild ist also keine Aussage über vollständige physische Kopien pro Commit. Zum Commit gehören Elternverweise und Metadaten. Die Beispiel-ID ist illustrativ."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ein Commit hält einen Stand fest."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F3EA" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#576B70" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">PRINZIP 04 / COMMIT</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Ein Commit hält einen Stand fest.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#576B70" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Der Diff zeigt die Änderung. Der Commit verweist auf den Projektstand.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#D2D9D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-f  fill="#172C36" text-anchor="start" data-max-width="300"><tspan x="147" dy="0">snacks.md</tspan></text><text x="677" y="607.78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#172C36" text-anchor="end" data-max-width="220"><tspan x="677" dy="0">unverändert</tspan></text><polyline points="780,494 896,494" fill="none" stroke="#172C36" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="895" cy="494" r="35" fill="#DAF975" stroke="none" stroke-width="3"/><text x="895" y="504.507" font-family="Courier New, monospace" font-size="37.45" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="70"><tspan x="895" dy="0">C</tspan></text><text x="985" y="341.78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="180"><tspan x="985" dy="0">ID</tspan></text><text x="985" y="385.24" font-family="Courier New, monospace" font-size="34" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="400"><tspan x="985" dy="0">a1b2c3d</tspan></text><text x="985" y="454.78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="350"><tspan x="985" dy="0">ELTERNCOMMIT</tspan></text><text x="985" y="500.96" font-family="Courier New, monospace" font-size="36" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="300"><tspan x="985" dy="0">B</tspan></text><text x="985" y="568.78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="350"><tspan x="985" dy="0">NACHRICHT</tspan></text><text x="985" y="606.22" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="560"><tspan x="985" dy="0">docs: clarify lunch venue</tspan></text><rect x="72" y="746" width="1456" height="62" rx="14" fill="#E4E8E2" stroke="none" stroke-width="2"/><text x="99" y="784.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#172C36" text-anchor="start" data-max-width="1385"><tspan x="99" dy="0">Ein guter Commit ist ein verständlicher Schritt mit einer hilfreichen Nachricht.</tspan></text></svg></section><section class="slide" id="slide-7" data-document-role="page" data-label="Ein Branch ist ein Namensschild." data-speaker-notes="Ein Branch ist ein beweglicher Verweis auf einen Commit. Wenn wir einen Branch anlegen, müssen wir nicht das ganze Projekt kopieren. Hier zeigen main und feature auf denselben Commit B. HEAD verweist normalerweise auf den aktuell ausgecheckten Branch, hier feature. Die Linien zwischen Commits zeigen Abstammung; wir zeichnen ältere Stände links."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ein Branch ist ein Namensschild."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#10232D" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#AAB9BD" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">PRINZIP 05 / BRANCH &amp; HEAD</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Ein Branch ist ein Namensschild.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Zwei Branch-Namen können auf denselben Commit zeigen.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#42555D" s  width="1600" height="900" rx="0" fill="#10232D" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#AAB9BD" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">PRINZIP 05 / EIN COMMIT SPÄTER</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Nur dein Branch bewegt sich.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Ein neuer Commit auf feature lässt main unverändert.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#42555D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F3EA" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">08</tspan></text><polyline points="240,498 735,498 1230,498" fill="none" stroke="#AAB9BD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="498" r="43" fill="#AAB9BD" stroke="none" stroke-width="3"/><text x="240" y="510.9086" font-family="Courier New, monospace" font-size="46.010000000000005" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="86"><tspan x="240" dy="0">A</tspan></text><circle cx="735" cy="498" r="43" fill="#DAF975" stroke="none" stroke-width="3"/><text x="735" y="510.9086" font-family="Courier New, monospace" font-size="46.010000000000005" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="86"><tspan x="735" dy="0">B</tspan></text><circle cx="1230" cy="498" r="43" fill="#65D9EC" stroke="none" stroke-width="3"/><text x="1230" y="510.9086" font-family="Courier New, monospace" font-size="46.010000000000005" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="86"><tspan x="1230" dy="0">C</tspan></text><rect x="650.0" y="350" width="170" height="48" rx="24" fill="#DAF975" stroke="none" stroke-width="2"/><text x="735.0" y="379.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="150"><tspan x="735.0" dy="0">main</tspan></text><polyline points="735,398 735,423" fill="none" stroke="#DAF975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="735,422 735,451" fill="none" stroke="#DAF975" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1120.0" y="350" width="220" height="48" rx="24" fill="#65D9EC" stroke="none" stroke-width="2"/><text x="1230.0" y="379.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="200"><tspan x="1230.0" dy="0">feature</tspan></text><polyline points="1230,398 1230,423" fill="none" stroke="#65D9EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1230,422 1230,451" fill="none" stroke="#65D9EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1100" y="610" width="170" height="48" rx="24" fill="#C5B5F2" stroke="none" stroke-width="2"/><text x="1185.0" y="639.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="150"><tspan x="1185.0" dy="0">HEAD</tspan></text><polyline points , Helvetica, sans-serif" font-size="18" font-weight="700" fill="#576B70" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">DER GEMEINSAME WORKFLOW</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">So wird aus einer Idee Teamarbeit.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#576B70" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Kleine Änderungen. Sichtbarer Kontext. Eine bewusste Freigabe.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#D2D9D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#576B70" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172C36" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">09</tspan></text><rect x="72" y="339" width="193" height="247" rx="20" fill="#E4E8E2" stroke="none" stroke-width="2"/><text x="93" y="379.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="155"><tspan x="93" dy="0">01</tspan></text><text x="93" y="457.94" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="175"><tspan x="93" dy="0">Issue</tspan></text><text x="93" y="518.2" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172C36" text-anchor="start" data-max-width="175"><tspan x="93" dy="0">Ziel klären</tspan></text><polyline points="268,463 279,463" fill="none" stroke="#172C36" stroke-width="2" stroke t Nachbesserung; Approve gibt den geprüften Stand frei."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ein PR macht Entscheidungen sichtbar."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F3EA" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#576B70" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">PRINZIP 06 / REVIEW</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Ein PR macht Entscheidungen sichtbar.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#576B70" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Der Diff zeigt das Was. Die Diskussion klärt das Warum.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#D2D9D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#576B70" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172C36" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">11</tspan></text><rect x="83" y="280" width="829" height="439" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="114" y="310" width="246" height="48" rx="24" fill="#E4E8E2" stroke="none" stroke-width="2"/><text x="237.0" y " width="663" height="130" rx="19" fill="#213944" stroke="none" stroke-width="2"/><text x="863" y="634.38" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="610"><tspan x="863" dy="0">Finales Review</tspan></text><text x="863" y="680.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#F5F3EA" text-anchor="start" data-max-width="610"><tspan x="863" dy="0">nachbessern → prüfen → mergen</tspan></text><rect x="72" y="746" width="1456" height="62" rx="14" fill="#213944" stroke="none" stroke-width="2"/><text x="99" y="784.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#F5F3EA" text-anchor="start" data-max-width="1385"><tspan x="99" dy="0">Entwürfe absenden. Erst nach finalem Review: Create a merge commit.</tspan></text></svg></section><section class="slide" id="slide-13" data-document-role="page" data-label="Holen ist noch nicht integrieren." data-speaker-notes="Die drei Zeilen gehören zu verschiedenen Orten: Server-Branch main, lokale Remote-Tracking-Ref origin/main und lokaler Branch main. Nach Fetch kann origin/main auf C stehen, während lokaler main auf B bleibt. Pull führt zunächst Fetch und dann einen Integrationsversuch aus. Im Workshop pull --ff-only: bei Divergenz bricht der Integrationsschritt ab. Die Folie zeigt den Zustand nach einem erfolgreichen Fetch und vor dem Pull."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Holen ist noch nicht integrieren."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F3EA" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" f ende main. Beim Rebase kann die ours/theirs-Zuordnung anders wirken; nicht verallgemeinern. Die Festivalleitung bestätigt Mensa, 12:30 Uhr und vegetarisches Buffet. Die endgültige Zeile noch nicht verraten."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Git stoppt. Ihr entscheidet."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#10232D" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#AAB9BD" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">PRINZIP 08 / KONFLIKT LESEN</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Git stoppt. Ihr entscheidet.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Im lokalen Konfliktlabor, auf team-b: git merge main</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#42555D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F3EA" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">15</tspan></text><rect x="73" y="275" width="1070" height="411" rx="22" fill="#213944" stroke="non "400" fill="#F5F3EA" text-anchor="start" data-max-width="1385"><tspan x="99" dy="0">Fertig: keine Marker, alle drei Vorgaben erfüllt, sauberer git status.</tspan></text></svg></section><section class="slide" id="slide-17" data-document-role="page" data-label="Drei Anforderungen. Eine Lösung." data-speaker-notes="Erst nach dem eigenen Lösungsversuch zeigen. Die gemeinsame Fassung lautet 12:30 Lunch in der Mensa mit vegetarischem Buffet. Das Zusammensetzen ist eine inhaltliche Entscheidung. git add markiert als gelöst, prüft aber keine fachliche Richtigkeit. Im Graph zeigt main weiter auf A, team-b nach dem Merge auf M; M hat A und B als Eltern. Das lokale Beispiel braucht keinen Push."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Drei Anforderungen. Eine Lösung."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F3EA" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#576B70" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">AUFLÖSUNG / ERST NACH DER PRAXIS</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Drei Anforderungen. Eine Lösung.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#576B70" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Eine gültige Endfassung enthält die Informationen aus beiden Änderungen.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#D2D9D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="rou etzen: Das ist eine Aussage über die History."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Fast-Forward: Das Schild rückt nach."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#10232D" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#AAB9BD" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">PRINZIP 09 / FAST-FORWARD</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Fast-Forward: Das Schild rückt nach.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Die Commits bleiben dieselben. Nur der Zielbranch bewegt sich.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#42555D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F3EA" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">18</tspan></text><text x="81" y="370.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#AAB9BD" text-anchor="start" data-max-width="280"><tspan x="81" dy="0">VORHER</tspan></text><polyline points="56 " font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="236"><tspan x="1243.0" dy="0">feature/info</tspan></text><rect x="1070" y="673" width="130" height="48" rx="24" fill="#DAF975" stroke="none" stroke-width="2"/><text x="1135.0" y="702.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="110"><tspan x="1135.0" dy="0">main</tspan></text><rect x="1220" y="673" width="282" height="48" rx="24" fill="#65D9EC" stroke="none" stroke-width="2"/><text x="1361.0" y="702.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="262"><tspan x="1361.0" dy="0">feature/info</tspan></text><polyline points="614,467 1204,467" fill="none" stroke="#DAF975" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1189.958679009754,474.67080861766726 1204,467 1189.958679009754,459.32919138233274" fill="none" stroke="#DAF975" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="902" y="438.08" font-family="Courier New, monospace" font-size="28" font-weight="700" fill="#DAF975" text-anchor="middle" data-max-width="710"><tspan x="902" dy="0">git merge --ff-only feature/info</tspan></text><rect x="72" y="746" width="1456" height="62" rx="14" fill="#213944" stroke="none" stroke-width="2"/><text x="99" y="784.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#F5F3EA" text-anchor="start" data-max-width="1385"><tspan x="99" dy="0">Kein neuer Commit. main steht jetzt auf dem vorhandenen Commit B.</tspan></text></svg></section><section class="slide" id="slide-19" data-document-role="page" data-label="Beide Linien sind weitergelaufen." data-speaker-notes="Im rebase-Labor stehen main und feature auf eigenen Nachfahren derselben Basis. B liegt nicht in der Abstammung von C. Auf main git merge --ff-only feature/volunteers ausführen: erwartete Ablehnung. Es läuft danach kein Merge, daher ist kein merge --abort nötig. Die Branches ändern verschiedene Dateien; die Ablehnung ist kein Dateikonflikt."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Beide Linien sind weitergelaufen."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#10232D" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#AAB9BD" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">PRINZIP 10 / DIVERGENZ</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Beide Linien sind weitergelaufen.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Fast-Forward ist hier unmöglich – auch ohne Dateikonflikt.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#42555D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F3EA" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">19</tspan></text><polyline points="260,506 675,356 1150,356" fill="none" stroke="#DAF975" stroke-width="8" stroke-linecap="round" stroke-linejoin etica, sans-serif" font-size="62" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Rebase: gleiche Änderung, neue Basis.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Der Feature-Branch wird neu aufgebaut. main bleibt noch stehen.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#42555D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F3EA" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">20</tspan></text><text x="85" y="294.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#AAB9BD" text-anchor="start" data-max-width="260"><tspan x="85" dy="0">VORHER</tspan></text><polyline points="350,439 650,354 1070,354" fill="none" stroke="#DAF975" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="350,439 650,529 1070,529" fill="none" stroke="#65D9EC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="439" r="31" fill="#AAB9BD" stroke="none" stroke-width="3"/><text x="350" y="448.3062" font-family="Courier New, monospace" font-size="33.17" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="62"><tspan x="350" dy="0">A</tspan></text><circle cx="1070" cy="354" r="31" fill="#DAF975" stroke="none" stroke-width="3"/><text x="1070" y="363.3062" font-family="Courier New, monospace" font-size="33.17" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="62"><tspan x="1070" dy="0">B</tspan></text><circle cx="1070" cy="529" r="31" fill="#65D9EC" stroke="none" stroke-width="3"/><text x="1070" y="538.3062" font-family="Courier New, monospace" font-size="33.17" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="62"><tspan x="1070" dy="0">C</tspan></text><rect x="1150" y="330" width="140" height="48" rx="24" fill="#DAF975" stroke="none" stroke-width="2"/><text x="1220.0" y="359.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="120"><tspan x="1220.0" dy="0">main</tspan></text><rect x="1150" y="505" width="215" height="48" rx="24" fill="#65D9EC" stroke="none" stroke-width="2"/><text x="1257.5" y="534.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="195"><tspan x="1257.5" dy="0">feature</tspan></text><text x="85" y="675.92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#AAB9BD" text-anchor="start" data-max-width="260"><tspan x="85" dy="0">NACHHER</tspan></text><polyline points="350,671 900,671 1390,671" fill="none" stroke="#AAB9BD" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="671" r="34" fill="#AAB9BD" stroke="none" stroke-width="3"/><text x="350" y="681.2067999999999" font-family="Courier New, monospace" font-size="36.38" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="68"><tspan x="350" dy="0">A</tspan></text><circle cx="900" cy="671" r="34" fill="#DAF975" stroke="none" stroke-width="3"/><text x="900" y="681.2067999999999" font-family="Courier New, monospace" font-size="36.38" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="68"><tspan x="900" dy="0">B</tspan></text><circle cx="1390" cy="671" r="34" fill="#65D9EC" stroke="none" stroke-width="3"/><text x="1390" y="681.2067999999999" font-family="Courier New, monospace" font-size="36.38" font-weight="70 32D" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#AAB9BD" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">PRINZIP 11 / NACH DEM REBASE</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Jetzt kann main folgen.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Zuerst Rebase auf feature. Danach Fast-Forward auf main.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#42555D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F3EA" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">21</tspan></text><polyline points="258,448 782,448 1310,448" fill="none" stroke="#AAB9BD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="258" cy="448" r="43" fill="#AAB9BD" stroke="none" stroke-width="3"/><text x="258" y="460.9086" font-family="Courier New, monospace" font-size="46.010000000000005" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="86"><tspan x="258" dy="0">A</tspan></text><circle cx="782" cy="448" r="43" fill="#AAB9BD" stroke="none" stroke-width="3"/><text x="782" y="460.9086" font-family="Courier New, monospace" font-size="46.010000000000005" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="86"><tspan x="782" dy="0">B</tspan></text><circle cx="1310" cy="448" r="43" fill="#65D9EC" stroke="none" stroke-width="3"/><text x="1310" y="460.9086" font-family="Courier New, monospace" font-size="46.010000000000005" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="86"><tspan x="1310" dy="0">C′</tspan></text><text x="770" y="285.78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#AAB9BD" text-anchor="middle" data-max-width="180"><tspan x="770" dy="0">vorher</tspan></text><rect x="680" y="315" width="180" height="48" rx="24" fill="#AAB9BD" stroke="none" stroke-width="2"/><text x="770.0" y="344.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="160"><tspan x="770.0" dy="0">main</tspan></text><polyline points="890,339 1205,339" fill="none" stroke="#DAF975" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1190.958679009754,346.67080861766726 1205,339 1190.958679009754,331.32919138233274" fill="none" stroke="#DAF975" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1305" y="285.78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#DAF975" text-anchor="middle" data-max-width="180"><tspan x="1305" dy="0">nachher</tspan></text><rect x="1215" y="315" width="180" height="48" rx="24" fill="#DAF975" stroke="none" stroke-width="2"/><text x="1305.0" y="344.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="160"><tspan x="1305.0" dy="0">main</tspan></text><rect x="1187" y="535" width="245" height="48" rx="24" fill="#65D9EC" stroke="none" stroke-width="2"/><text x="1309.5" y="564.78" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="225"><tspan x="1309.5" dy="0">feature</tspan></text><text x="160" y="648.38" font-family="Courier New, monospace" font-size="33" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="1250"><tspan x="160" dy="0">1  git switch main</tspan></text><text x="160" y="705.38" font-family="Courier New, monospace" font-size="33" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="1330"><tspan x="160" dy="0">2  git merge --ff-only feature/volunteers</tspan></text><rect x="72" y="746" width="1456" height="62" rx="14" fill="#213944" stroke="none" stroke-width="2"/><text x="99" y="784.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#F5F3EA" text-anchor="start" data-max-width="1385"><tspan x="99" dy="0">Das Fast-Forward erzeugt keinen weiteren Commit.</tspan></text></svg></section><section class="slide" id="slide-22" data-document-role="page" data-label="Drei Wege. Drei Geschichten." data-speaker-notes="Alle drei Skizzen starten gedanklich bei O: main ist bis B gelaufen; der Feature-Zweig hat C und D. Links Merge: M verbindet B und D, beide Linien bleiben sichtbar. Mitte Rebase: C′ und D′ werden auf B neu aufgebaut und danach integriert. Rechts Squash-Integration: ein neuer S fasst den Inhalt des Features auf B zusammen. Gleiche resultierende Dateien sind im konfliktfreien Beispiel möglich, die History unterscheidet sich. GitHub Rebase and merge erzeugt neue IDs und ist nicht identisch mit lokalem --ff-only."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Drei Wege. Drei Geschichten."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F3EA" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#576B70" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">EINORDNUNG / MERGE · REBASE · SQUASH</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Drei Wege. Drei Geschichten.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#576B70" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Entscheidet nach Zusammenarbeit und gewünschter Nachvollziehbarkeit.</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#D2D9D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#576B70" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172C36" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">22</tspan></text><rect x="73" y="284" width="462" height="429" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="97" y="309" width="414" height="48" rx="24" fill="#DAF975" stroke="none" stroke-width="2"/><text x="304.0" y="343.94" font-family="Courier New, monospace" font-size="29" font-weight="700" fill="#172C36" text-anchor="middle" data-max-width="394"><tspan x="304.0" dy="0">Merge-Commit</tspan></text><rect x="569" y="284" width="462" height="429" rx="24" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="593" y="309" width="414" height="48" rx="24" fill="#65D9EC" stroke="none" stroke-width="2"/><text x="800.0" y="343.94" font-family="Courier New, monospace" font-size= ax-width="650"><tspan x="221" dy="0">Merge ohne Konflikt</tspan></text><text x="221" y="678.08" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#172C36" text-anchor="start" data-max-width="1150"><tspan x="221" dy="0">Ist das Ergebnis deshalb richtig?</tspan></text><rect x="72" y="746" width="1456" height="62" rx="14" fill="#E4E8E2" stroke="none" stroke-width="2"/><text x="99" y="784.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#172C36" text-anchor="start" data-max-width="1385"><tspan x="99" dy="0">Eine gute Erklärung beschreibt den Zustand vor und nach dem Befehl.</tspan></text></svg></section><section class="slide" id="slide-25" data-document-role="page" data-label="Erst verstehen. Dann integrieren." data-speaker-notes="Sammelt drei konkrete Regeln für eure nächste Zusammenarbeit. Lasst die Gruppe formulieren: Status und Branch zuerst lesen; kleine verständliche Änderungen; Reviews begründen und den finalen Stand prüfen. Wer noch keinen eigenen Konflikt gelöst hat, plant genau diesen nächsten Übungsschritt. Verweise auf Glossar, Spickzettel und Drehbuch im Repository. Letzte fünf Minuten sind Puffer."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Erst verstehen. Dann integrieren."><rect x="0" y="0" width="1600" height="900" rx="0" fill="#10232D" stroke="none" stroke-width="2"/><text x="72" y="56.34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="380"><tspan x="72" dy="0">GIT WORKFLOW DOJO</tspan></text><text x="1528" y="55.480000000000004" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#AAB9BD" text-anchor="end" data-max-width="700"><tspan x="1528" dy="0">TRANSFER / MINUTE 110–120</tspan></text><text x="72" y="154.32" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="1460"><tspan x="72" dy="0">Erst verstehen. Dann integrieren.</tspan></text><text x="75" y="208.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1440"><tspan x="75" dy="0">Welche drei Regeln nehmt ihr in eure nächste Zusammenarbeit mit?</tspan></text><polyline points="72,835 1528,835" fill="none" stroke="#42555D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="866.76" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="1200"><tspan x="72" dy="0">CAMPUS FESTIVAL  /  LERNEN DURCH AUSPROBIEREN</tspan></text><text x="1528" y="869.64" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F5F3EA" text-anchor="end" data-max-width="90"><tspan x="1528" dy="0">25</tspan></text><text x="73" y="361.7" font-family="Arial, Helvetica, sans-serif" font-size="95" font-weight="700" fill="#65D9EC" text-anchor="start" data-max-width="450"><tspan x="73" dy="0">01</tspan></text><text x="73" y="454.68" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="462"><tspan x="73" dy="0">Zustand lesen</tspan></text><text x="73" y="511.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="440"><tspan x="73" dy="0">Repository</tspan><tspan x="73" dy="33.21">Branch</tspan><tspan x="73" dy="33.21">Status</tspan></text><text x="573" y="361.7" font-family="Arial, Helvetica, sans-serif" font-size="95" font-weight="700" fill="#C5B5F2" text-anchor="start" data-max-width="450"><tspan x="573" dy="0">02</tspan></text><text x="573" y="454.68" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="462"><tspan x="573" dy="0">Kleine Schritte</tspan></text><text x="573" y="511.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="440"><tspan x="573" dy="0">klare Commits</tspan><tspan x="573" dy="33.21">verständliche PRs</tspan></text><text x="1073" y="361.7" font-family="Arial, Helvetica, sans-serif" font-size="95" font-weight="700" fill="#DAF975" text-anchor="start" data-max-width="450"><tspan x="1073" dy="0">03</tspan></text><text x="1073" y="454.68" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#F5F3EA" text-anchor="start" data-max-width="462"><tspan x="1073" dy="0">Gemeinsam prüfen</tspan></text><text x="1073" y="511.22" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#AAB9BD" text-anchor="start" data-max-width="440"><tspan x="1073" dy="0">Feedback</tspan><tspan x="1073" dy="33.21">Nachbesserung</tspan><tspan x="1073" dy="33.21">Freigabe</tspan></text><rect x="73" y="704" width="1455" height="100" rx="20" fill="#DAF975" stroke="none" stroke-width="2"/><text x="106" y="759.82" font-family="Courier New, monospace" font-size="37" font-weight="700" fill="#172C36" text-anchor="start" data-max-width="1380"><tspan x="106" dy="0">github.com/Witzelfitz/git-workflow-dojo</tspan></text></svg></section></body></html>
